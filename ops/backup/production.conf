# Weekly backup of PRODUCTION: website content + Assets data + uploaded files (bash syntax).
# install.sh copies this to ~/.nova-backup/production.conf the first time; edit that copy on the server.
BACKUP_NAME=production

# One database holds both the website-editor tables and the Assets tables.
# Its login is read from the API's own .env.php, so no password is stored here.
DB_SOURCES=("envphp:$HOME/content-api/.env.php")

# Uploaded photos and documents for the editor (public/media). Assets files kept via FTP are
# encrypted by the app itself; add that folder here once its FTP account exists.
FILE_PATHS=("$HOME/content-api/public/media")

AGE_RECIPIENTS=("age14359yxnh8ckzs2zfur3dyyjerc9gt4ppxrqay9ln0g2txcw8jqzsv7q8ed")
DRIVE_REMOTE="gdrive:NovaSS-Backups/production"
GIT_REPO_DIR="$HOME/.nova-backup/git"
KEEP_WEEKLY=12
KEEP_MONTHLY=6
ALERT_EMAIL="it-support@novasstrading.com"
PHP_BIN=/opt/cpanel/ea-php81/root/usr/bin/php
