# Weekly backup of the STAGING editor + Assets data (bash syntax, read by nova-backup.sh).
# install.sh copies this to ~/.nova-backup/staging.conf; edit that copy on the server, not this one.
BACKUP_NAME=staging

# The staging database holds both the website-editor tables and the Assets tables.
# Its login is read from the API's own .env.php, so no password is stored here.
DB_SOURCES=("envphp:$HOME/content-api-staging/.env.php")

# Uploaded photos and documents for the staging editor.
FILE_PATHS=("$HOME/content-api-staging/public/media")

# PUBLIC half of the backup key. The private half (needed to restore) is kept offline by the owner.
AGE_RECIPIENTS=("age14359yxnh8ckzs2zfur3dyyjerc9gt4ppxrqay9ln0g2txcw8jqzsv7q8ed")

DRIVE_REMOTE="gdrive:NovaSS-Backups/staging"
GIT_REPO_DIR="$HOME/.nova-backup/git"
KEEP_WEEKLY=12
KEEP_MONTHLY=6
ALERT_EMAIL="it-support@novasstrading.com"
PHP_BIN=/opt/cpanel/ea-php81/root/usr/bin/php
